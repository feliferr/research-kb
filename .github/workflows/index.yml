name: index

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frontmatter válido e índices em dia
        run: python3 scripts/build_index.py --check
      - name: Nenhum termo proibido no repositório público
        run: python3 scripts/check_denylist.py
