name = "research-kb-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
PRIVATE_REPO = "feliferr/research-kb-inbox"
TIMEZONE = "America/Sao_Paulo"

# Horários em UTC (Brasília = UTC-3). Cada expressão precisa existir em CRONS (src/index.js).
[triggers]
crons = ["0 11 * * 1", "0 22 * * 0,4"]

# Segredos (não ficam aqui): wrangler secret put TELEGRAM_BOT_TOKEN | TELEGRAM_WEBHOOK_SECRET | ALLOWED_USER_ID | GITHUB_DISPATCH_TOKEN
